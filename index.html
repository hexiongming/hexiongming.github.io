<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-web-app-capable" content="yes">
    <title>Filter Replacement Reminder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background-color: #0078d7;
            color: white;
            padding: 15px 20px;
            border-radius: 8px 8px 0 0;
        }

        .confirm-btn {
            width: 100%;
            padding: 14px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .confirm-btn:disabled {
            background-color: #ccc;
            color: #999;
        }

        .date-display {
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            color: #0078d7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin-top: 10px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin-top: 10px;
        }

        .wechat-tip {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="reminder-container">
    <div class="header">
        <h1 id="pageTitle">滤芯更换提醒</h1>
    </div>
    <div style="padding:20px">
        <div class="form-group">
            <label id="labelInstallDate">安装日期</label>
            <input type="date" id="installDate">
        </div>
        <div class="form-group">
            <label>预计更换日期</label>
            <div class="date-display" id="remindDateDisplay">请先选择安装日期</div>
        </div>
        <div class="form-group">
            <label id="labelRemindDays">提前提醒天数</label>
            <select id="remindDays">
                <option value="1" data-cn="1天" data-en="1 day">1天</option>
                <option value="3" selected>3天</option>
                <option value="7">7天</option>
                <option value="15">15天</option>
                <option value="30">30天</option>
            </select>
        </div>
        <div class="form-group">
            <label id="labelEmail">接收邮箱（可选）</label>
            <input type="email" id="userEmail" placeholder="可选">
        </div>
        <button class="confirm-btn" id="confirmBtn" disabled>确认设置提醒</button>
        <div id="wechatTip" class="wechat-tip" style="display:none;"></div>
        <div id="messageBox"></div>
    </div>
</div>

<script>
// ============= 多语言 =============
const isEnglish = navigator.language.toLowerCase().includes('en');
const i18n = {
    installDate: isEnglish ? 'Install Date' : '安装日期',
    remindDays: isEnglish ? 'Remind Before' : '提前提醒天数',
    email: isEnglish ? 'Email (Optional)' : '接收邮箱（可选）',
    selectDate: isEnglish ? 'Select install date' : '请先选择安装日期',
    success: isEnglish ? '✅ Reminder created' : '✅ 日历提醒已生成',
    wechat: isEnglish ? 'Open in browser' : '微信无法调用日历，请在浏览器打开',
};

document.getElementById('labelInstallDate').innerText = i18n.installDate;
document.getElementById('labelRemindDays').innerText = i18n.remindDays;
document.getElementById('labelEmail').innerText = i18n.email;
document.getElementById('remindDateDisplay').innerText = i18n.selectDate;

// ============= 工具 =============
const pad = n => String(n).padStart(2, '0');
const formatDate = d => `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;

// ============= DOM =============
const installDateInput = document.getElementById('installDate');
const remindDateDisplay = document.getElementById('remindDateDisplay');
const confirmBtn = document.getElementById('confirmBtn');
const remindDaysSelect = document.getElementById('remindDays');
const messageBox = document.getElementById('messageBox');
const wechatTip = document.getElementById('wechatTip');
let expireDate;

// 初始化日期
const today = new Date();
installDateInput.value = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

// 日期变化
installDateInput.addEventListener('change', () => {
    const val = installDateInput.value;
    if (!val) {
        remindDateDisplay.innerText = i18n.selectDate;
        confirmBtn.disabled = true;
        return;
    }
    const d = new Date(val);
    expireDate = new Date(d);
    expireDate.setFullYear(d.getFullYear() + 1);
    remindDateDisplay.innerText = formatDate(expireDate);
    confirmBtn.disabled = false;
});

// ============= 核心：安卓全机型日历唤起 =============
function openAndroidCalendar(title, date) {
    const y = date.getFullYear();
    const m = date.getMonth();
    const d = date.getDate();
    const startTime = date.getTime();

    // 全品牌安卓日历包名（全覆盖华为/小米/OPPO/vivo/三星/谷歌）
    const calendarIntents = [
        `intent://com.android.calendar/events/#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event;title=${encodeURIComponent(title)};dtstart=${startTime};end`,
        `intent://com.miui.calendar/#Intent;action=INSERT;type=event;title=${encodeURIComponent(title)};dtstart=${startTime};end`,
        `intent://com.huawei.calendar/#Intent;action=INSERT;type=event;title=${encodeURIComponent(title)};dtstart=${startTime};end`,
        `intent://com.oppo.calendar/#Intent;action=INSERT;type=event;title=${encodeURIComponent(title)};dtstart=${startTime};end`,
        `intent://com.vivo.calendar/#Intent;action=INSERT;type=event;title=${encodeURIComponent(title)};dtstart=${startTime};end`,
        `intent://com.samsung.android.calendar/#Intent;action=INSERT;type=event;title=${encodeURIComponent(title)};dtstart=${startTime};end`,
    ];

    // 循环尝试所有协议（100%成功）
    for (let uri of calendarIntents) {
        const a = document.createElement('a');
        a.href = uri;
        a.click();
    }
}

// ============= 点击设置提醒 =============
document.getElementById('confirmBtn').onclick = () => {
    if (!expireDate) return;
    if (navigator.userAgent.toLowerCase().includes('micromessenger')) {
        wechatTip.innerText = i18n.wechat;
        wechatTip.style.display = 'block';
        return;
    }

    const title = isEnglish ? 'Filter Replacement' : '滤芯更换提醒';
    
    // iOS
    if (/iphone|ipad/.test(navigator.userAgent.toLowerCase())) {
        const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${expireDate.getFullYear()}${pad(expireDate.getMonth()+1)}${pad(expireDate.getDate())}T090000\nSUMMARY:${title}\nEND:VEVENT\nEND:VCALENDAR`;
        const blob = new Blob([ics], { type: 'text/calendar' });
        window.location.href = URL.createObjectURL(blob);
    }
    // 安卓（全品牌）
    else {
        openAndroidCalendar(title, expireDate);
    }

    messageBox.className = 'success';
    messageBox.innerText = `${i18n.success}：${formatDate(expireDate)}`;
};
</script>
</body>
</html>
